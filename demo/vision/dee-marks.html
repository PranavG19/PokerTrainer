<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offsuit — Dee, five mark directions</title>
<link rel="stylesheet" href="vision.css" />
<!-- Mock-only comparison sheet. Five genuinely different directions for Dee's mark, each at hero, 64px (the perch),
     24px and 16px (the nav), with the same eight expressions. ?blind=1 hides names and the recommendation and
     reorders the columns (for the blind rater). The recommendation is carried through every other mock. -->
<style>
  .marks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; min-height: 0; }
  .mk { display: grid; grid-template-rows: auto 1fr auto auto auto; gap: 14px; padding: 14px 14px 14px; overflow: hidden; grid-template-columns: minmax(0, 1fr); }
  .mk.rec { box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.30), var(--top-light); background: linear-gradient(180deg, oklch(1 0 0 / 0.06), oklch(1 0 0 / 0.02)); }
  .mk header { display: flex; flex-direction: column; gap: 1px; }
  .mk h3 { font-size: var(--t-head); font-weight: 600; }
  .mk header .caption { line-height: 1.3; }
  .hero { min-height: 120px; display: grid; place-items: center; }
  .sizes { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr 1fr; align-items: center; justify-items: center; gap: 4px 8px; padding: 10px 10px 8px; border-radius: var(--r-ctl); background: oklch(0 0 0 / 0.18); box-shadow: inset 0 0 0 0.5px var(--hair); }
  .sizes figure { display: flex; align-items: center; gap: 6px; }
  .sizes figure:first-child { grid-row: span 2; flex-direction: column; }
  .sizes figcaption { font-size: var(--t-cap); color: var(--ink-3); }
  .navchip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 7px 0 5px; border-radius: 6px; background: var(--fill-1); font-size: var(--t-foot); font-weight: 600; }
  .expr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 0; justify-items: center; }
  .note { font-size: var(--t-foot); color: var(--ink-2); line-height: 1.45; }
  .legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: var(--t-foot); color: var(--ink-3); }
  .legend b { color: var(--ink-2); font-weight: 500; }
  .note b { color: var(--ink-1); font-weight: 500; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  @media (max-width: 1000px) {
    .marks { gap: 8px; } .mk { padding: 10px 10px; gap: 10px; } .hero { min-height: 84px; }
    .note { font-size: var(--t-cap); }
    .sizes { padding: 8px 6px 6px; gap: 4px 4px; } .legend { font-size: var(--t-cap); gap: 4px 10px; }
  }
</style>
</head>
<body data-tab="You">
<div class="shell">
  <nav data-nav></nav>
  <main class="main">
    <div class="vpage" style="grid-template-rows: auto auto 1fr; height: 100%; gap: 14px;">
      <div class="top">
        <div><h1 class="t-t2">Dee’s mark</h1><p class="sub">Five directions, the same eight expressions, at every size Dee is used.</p></div>
        <p class="caption" id="legend">Recommended: Two lights. The others stay open for you to choose.</p>
      </div>
      <p class="legend" aria-label="Expression order"><span>Expressions, row 1:</span><b>Rest</b><b>Listening</b><b>Glance</b><b>Thinking</b><span>· row 2:</span><b>Price held</b><b>Serious</b><b>The gate</b><b>Asleep</b></p>
      <div class="marks" id="marks"></div>
    </div>
  </main>
</div>
<script src="shell.js"></script>
<script src="dee.js"></script>
<script>
  const D = [
    { key: 'face', name: 'Two lights', kind: 'Object with a face', note: '<b>The dealer button in bone ceramic</b>, with two engraved lights. They glance, narrow and smile, and that is the whole face. At 16px it is still a button with two dots.' },
    { key: 'button', name: 'The button', kind: 'Refined object', note: '<b>The same ceramic object</b>, with a smoked-glass jewel and DEALER engraved round the rim. Expression is only posture and the glint, so it has the most craft and the least warmth.' },
    { key: 'orbit', name: 'Orbit', kind: 'Abstract glyph', note: '<b>The button’s path round the table:</b> a ring with one bead. It is crisp at 16px and works as an app mark. The bead’s position does the expressing.' },
    { key: 'pebble', name: 'Pebble', kind: 'Soft character', note: '<b>A domed smoked-glass pebble</b> with one bone visor of light. It is the warmest and most robot-like. At 16px the visor reads as a minus.' },
    { key: 'monogram', name: 'The d', kind: 'Product monogram', note: '<b>A lowercase d whose bowl is the button,</b> on a glass tile, the way Apple sets its product marks. It is a great icon but a weak character: the counter is its only expression.' },
  ];
  const POSES = [['rest', 'Rest'], ['attentive', 'Listening'], ['glance', 'Glance'], ['thinking', 'Thinking'], ['pleased', 'Price held'], ['serious', 'Serious'], ['notable', 'The gate'], ['asleep', 'Asleep']];
  const blind = new URLSearchParams(location.search).get('blind') === '1';
  const order = blind ? [3, 0, 4, 1, 2] : [0, 1, 2, 3, 4];
  if (blind) document.getElementById('legend').textContent = 'Directions are labelled 1–5.';
  document.getElementById('marks').innerHTML = order.map((i, n) => {
    const d = D[i], S = (pose, size) => Dee.svg(d.key, pose, size);
    return `<section class="tile mk${!blind && i === 0 ? ' rec' : ''}" aria-label="${blind ? 'Direction ' + (n + 1) : d.name}">
      <header><h3>${blind ? 'Direction ' + (n + 1) : d.name}</h3>${blind ? '' : `<span class="caption">${d.kind}${i === 0 ? ' · recommended' : ''}</span>`}</header>
      <div class="hero">${S('rest', innerWidth < 1000 ? 84 : 124)}</div>
      <div class="sizes">
        <figure>${S('rest', 64)}<figcaption>64</figcaption></figure>
        <figure>${S('rest', 24)}<figcaption>24</figcaption></figure>
        <figure><span class="navchip">${S('rest', 16)}23</span><figcaption>16</figcaption></figure>
      </div>
      <div class="expr">${POSES.map(([p, l]) => `<span role="img" aria-label="${l}">${S(p, innerWidth < 1000 ? 28 : 36)}</span>`).join('')}</div>
      ${blind ? '' : `<p class="note">${d.note}</p>`}
    </section>`;
  }).join('');
</script>
</body>
</html>
